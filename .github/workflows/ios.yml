name: iOS Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    name: iOS
    env:
      SDK_VERSION: 13.4.1.GA
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Titanium CLI
        run: npm i -g titanium

      - name: Install Titanium SDK
        run: ti sdk install ${{ env.SDK_VERSION }} --no-progress-bars

      - name: Set SDK version in titanium.xcconfig
        run: sed -i .bak 's/TITANIUM_SDK_VERSION = .*/TITANIUM_SDK_VERSION = ${{ env.SDK_VERSION }}/' ios/titanium.xcconfig

      - name: Build module
        run: ti build -p ios --build-only
        working-directory: ios

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti.urlsession-ios
          path: ios/dist/*-iphone-*.zip
          if-no-files-found: error
